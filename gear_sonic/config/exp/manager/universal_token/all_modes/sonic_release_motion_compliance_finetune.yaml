# @package _global_
# Strict official residual initialization; release policy/value stay frozen.

defaults:
  - /exp/manager/universal_token/all_modes/sonic_release_motion_compliance
  - _self_

exp_var: motion_compliance_finetune
resume: false
base_dir: /home/lab/Desktop/GR00T-WholeBodyControl/compliance_control/runs/motion
checkpoint: /home/lab/Desktop/GR00T-WholeBodyControl/compliance_control/official_assets/sonic_release/last.pt
num_envs: 16
use_wandb: false

trainer:
  _target_: gear_sonic.compliance_control.training.trainer.MotionCompliancePPOTrainer

algo:
  config:
    num_learning_iterations: 5
    actor:
      _target_: gear_sonic.compliance_control.training.actor.MotionComplianceFrozenNoiseActor
      backbone:
        motion_compliance_residual_hidden_dims: [256, 256]
    critic:
      motion_compliance_residual_hidden_dims: [256, 256]

motion_compliance_checkpoint_initialization:
  enabled: true
  output_path: ${experiment_dir}/artifacts/motion_compliance_residual_init.pt
  overwrite: false

motion_compliance_finetune:
  stage: residual_only
  enforce_phase4_smoke_contract: true
  resume_output_dir: null

manager_env:
  commands:
    motion:
      motion_lib_cfg:
        motion_file: /home/lab/Desktop/GR00T-WholeBodyControl/compliance_control/official_assets/sample_data/robot_filtered/210531/walk_forward_amateur_001__A001.pkl
        smpl_motion_file: /home/lab/Desktop/GR00T-WholeBodyControl/compliance_control/official_assets/sample_data/smpl_filtered
        multi_thread: false
    motion_compliance:
      enabled: true
      enable_probability: 1.0
      site_activation_probability: 1.0
      force_threshold_range_n: [10.0, 10.0]
      reference_offset_range_m: [0.05, 0.05]
      resampling_time_range: [0.02, 0.02]

callbacks:
  model_save:
    save_last_frequency: 5
  motion_compliance_exposure:
    _target_: gear_sonic.compliance_control.training.callback.MotionComplianceExposureCallback
    output_path: ${experiment_dir}/artifacts/motion_compliance_exposure.json
    command_name: motion_compliance
    require_exposure: true
