force:
  _target_: gear_sonic.compliance_control.adapters.sonic.isaaclab.command.SonicComplianceCommandCfg
  asset_name: robot
  reference_body_names: ${manager_env.commands.motion.body_names}
  site_names: [left_wrist_yaw_link, right_wrist_yaw_link]
  site_offsets_local_xyz:
    - [0.18, -0.025, 0.0]
    - [0.18, 0.025, 0.0]
  anchor_body: ${manager_env.commands.motion.anchor_body}
  num_future_frames: ${manager_env.commands.motion.num_future_frames}
  frame_kind: heading_local
  enabled: false
  enabled_probability: 1.0
  site_probability: 0.5
  force_magnitude_range_n: [0.0, 40.0]
  compliance_values_m_per_n: [0.0, 0.02, 0.05]
  force_duration_range_s: [1.0, 3.0]
  pulse_interval_range_s: [3.5, 6.0]
  force_rise_end: 0.2
  force_fall_start: 0.8
  max_active_sites: 2
  max_net_force_n: 30.0
  max_net_torque_nm: 20.0
  sampling_seed: ${seed}
  max_displacement_m: 0.25
  target_damper_enabled: false
  target_damper_alpha: 0.1
  debug_vis: false
